name: mecmcp package conformance
description: >
  Check an assembled mecmcp-family package against the shared contract.
  Static inspection only -- this proves nothing about runtime enforcement.

inputs:
  staging:
    description: Directory the caller populated with the assembled package
    required: true
  manifest:
    description: Path to packaging/conformance.toml
    required: true
  prebuilt:
    description: >
      Set to 'true' when the staged binary was supplied prebuilt rather than
      compiled by the packager. Enables R3's check that BUILD-INFO does not
      name a toolchain that did not compile the binary.
    required: false
    default: 'false'
  image:
    description: Built image tag for R6. Empty skips R6.
    required: false
    default: ''
  overrides:
    description: Operator arguments R6 passes to the container
    required: false
    default: '--host 0.0.0.0'

runs:
  using: composite
  steps:
    - name: Verify the package
      shell: bash
      env:
        CONF_STAGING: ${{ inputs.staging }}
        CONF_MANIFEST: ${{ inputs.manifest }}
        CONF_PREBUILT: ${{ inputs.prebuilt }}
      run: |
        args=(--staging "$CONF_STAGING" --manifest "$CONF_MANIFEST")
        if [[ "$CONF_PREBUILT" == "true" ]]; then
          args+=(--prebuilt)
        fi
        bash "$GITHUB_ACTION_PATH/verify-package.sh" "${args[@]}"

    - name: Verify the image argv
      if: inputs.image != ''
      shell: bash
      env:
        CONF_IMAGE: ${{ inputs.image }}
        CONF_MANIFEST: ${{ inputs.manifest }}
        CONF_OVERRIDES: ${{ inputs.overrides }}
      run: |
        # `set -f` so a `*` in overrides cannot pathname-expand against the
        # runner's working directory before it reaches the script.
        set -f
        args=()
        for token in $CONF_OVERRIDES; do args+=(--override "$token"); done
        set +f
        bash "$GITHUB_ACTION_PATH/verify-image.sh" \
          --image "$CONF_IMAGE" \
          --manifest "$CONF_MANIFEST" \
          "${args[@]}"

    # An `if:`-skipped step produces no output, so a log could not distinguish
    # "R6 passed" from "R6 never ran" -- and the first adopter omitted `image`.
    - name: Note that R6 did not run
      if: inputs.image == ''
      shell: bash
      run: |
        echo "note: R6 (image argv) did NOT run: no 'image' input was given, so"
        echo "note: nothing checked that must_survive_override flags survive an"
        echo "note: operator override. Pass image: <tag> to enable it."
