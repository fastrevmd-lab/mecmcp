# mecmcp audit forwarding — ECS over TCP syslog.
# Reference template. See docs/AUDIT-FORWARDING-STANDARD.md for the rationale.
#
# Substitute before install:
#   @SERVICE@    service name, e.g. rust-junosmcp
#   @AUDIT_LOG@  audit file, e.g. /var/lib/jmcp/audit.jsonl
#   @COLLECTOR@  event-store ingest host, e.g. 192.168.1.150
#
# Requires the server to run with:
#   --audit-format json --audit-log-file @AUDIT_LOG@
# The text format is not a parse target and must not be forwarded.

module(load="imfile")

input(type="imfile"
      File="@AUDIT_LOG@"
      Tag="mcp-audit"
      Severity="info"
      Facility="local5"
      ruleset="mcp_audit_fwd")

ruleset(name="mcp_audit_fwd") {
    # TCP, not UDP. Device telemetry on 514-518 is high-volume and individually
    # disposable; these are audit records, where a silently dropped datagram is
    # indistinguishable from an action that never happened.
    action(type="omfwd"
           Target="@COLLECTOR@"
           Port="519"
           Protocol="tcp"

           # Never give up on the collector. The default retry count abandons
           # the destination and discards the backlog.
           action.resumeRetryCount="-1"

           # Disk-assisted queue: a collector restart or a reboot buffers
           # rather than discards. saveOnShutdown is the half that survives a
           # reboot -- without it the in-memory queue is lost exactly when it
           # is most needed.
           queue.type="LinkedList"
           queue.filename="mcp_audit_fwd"
           queue.saveOnShutdown="on"
           queue.maxDiskSpace="256m"
           queue.spoolDirectory="/var/spool/rsyslog")
}
