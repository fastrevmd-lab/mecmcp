[workspace]
members  = ["crates/mecmcp-auth", "crates/mecmcp-audit", "crates/mecmcp-changeset", "crates/mecmcp-scp", "crates/mecmcp-transport", "crates/mecmcp-runtime", "crates/mecmcp-policy", "crates/mecmcp-inventory", "crates/mecmcp-device", "crates/mecmcp-secret", "crates/mecmcp-http", "crates/mecmcp-job", "crates/mecmcp-openapi", "crates/mecmcp-server"]
resolver = "2"

[workspace.package]
version      = "0.23.1"
edition      = "2024"
rust-version = "1.88"
license      = "MIT"
repository   = "https://github.com/fastrevmd-lab/mecmcp"
authors      = ["fastrevmd-lab"]

[workspace.dependencies]
arc-swap   = "1"
async-trait = "0.1"
base64     = "0.22"
chrono     = { version = "0.4", default-features = false, features = ["serde", "clock"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom  = "0.4"
globset    = "0.4"
hmac       = "0.13"
metrics    = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
# Require russh >=0.62.5 to avoid CVE-2026-68930 (SSH handshake vulnerability in 0.62.0-0.62.4).
# Do not relax to "0.62" — Cargo.lock is gitignored and cannot protect downstream consumers.
russh      = { version = ">=0.62.5, <0.63", default-features = false, features = ["flate2", "aws-lc-rs"] }
rustix     = { version = "1", features = ["fs", "process"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.11"
subtle     = "2"
tempfile   = "3"
thiserror  = "2"
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tracing    = "0.1"
log        = "0.4"
tracing-log = "0.2"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid       = { version = "1", features = ["v4"] }
zeroize    = { version = "1", features = ["derive"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
dbg_macro   = "deny"
todo        = "deny"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
