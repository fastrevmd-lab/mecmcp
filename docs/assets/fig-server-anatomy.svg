<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-label="Anatomy of a vendor MCP server: mecmcp owns the transport boundary above the vendor handler and the domain crates below it, so vendor code sits between two mecmcp layers. The handler re-checks the caller using mecmcp-server on four of the six servers; Junos and PAN-OS use a local equivalent.">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#9AA2AD"/>
    </marker>
    <style>
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>
  <rect x="0" y="0" width="980" height="480" rx="8" fill="#0B0D12"/>
  <g transform="translate(15,14)">

    <rect x="300" y="20" width="340" height="46" rx="5" fill="#171A22" stroke="#262B38"/>
    <text class="m" x="470" y="41" text-anchor="middle" font-size="12.5" fill="#F8F9FA">MCP client</text>
    <text class="m" x="470" y="56" text-anchor="middle" font-size="10" fill="#9AA2AD">agent · CI · operator</text>
    <text class="m" x="280" y="47" text-anchor="end" font-size="10.5" fill="#9AA2AD">caller</text>
    <text class="m" x="660" y="47" font-size="10.5" fill="#9AA2AD">tools/call over streamable HTTP</text>
    <line x1="470" y1="66" x2="470" y2="86" stroke="#9AA2AD" stroke-width="1.2" marker-end="url(#a1)"/>

    <rect x="300" y="92" width="340" height="46" rx="5" fill="#0C3A37" stroke="#0D9488"/>
    <text class="m" x="470" y="113" text-anchor="middle" font-size="12.5" fill="#B7F5F0">transport boundary</text>
    <text class="m" x="470" y="128" text-anchor="middle" font-size="10" fill="#4DD0C8">ten ordered gates</text>
    <text class="m" x="280" y="119" text-anchor="end" font-size="10.5" fill="#4DD0C8">mecmcp</text>
    <text class="m" x="660" y="113" font-size="10.5" fill="#9AA2AD">mecmcp-transport · -auth</text>
    <text class="m" x="660" y="127" font-size="10.5" fill="#9AA2AD">mecmcp-audit · -secret</text>
    <line x1="470" y1="138" x2="470" y2="158" stroke="#9AA2AD" stroke-width="1.2" marker-end="url(#a1)"/>

    <rect x="300" y="164" width="340" height="46" rx="5" fill="#2A1B4D" stroke="#7C3AED"/>
    <text class="m" x="470" y="185" text-anchor="middle" font-size="12.5" fill="#C4B5FD">vendor tool handlers</text>
    <text class="m" x="470" y="200" text-anchor="middle" font-size="10" fill="#C4B5FD">15 – 54 tools, per server</text>
    <text class="m" x="280" y="191" text-anchor="end" font-size="10.5" fill="#C4B5FD">vendor</text>
    <text class="m" x="660" y="185" font-size="10.5" fill="#9AA2AD">re-checks the caller itself —</text>
    <text class="m" x="660" y="199" font-size="10.5" fill="#9AA2AD">mecmcp-server on 4 of 6; junos and</text>
    <text class="m" x="660" y="213" font-size="10.5" fill="#9AA2AD">panos use a local equivalent</text>
    <line x1="470" y1="210" x2="470" y2="230" stroke="#9AA2AD" stroke-width="1.2" marker-end="url(#a1)"/>

    <rect x="300" y="236" width="340" height="46" rx="5" fill="#0C3A37" stroke="#0D9488"/>
    <text class="m" x="470" y="257" text-anchor="middle" font-size="12.5" fill="#B7F5F0">change control · policy · leases</text>
    <text class="m" x="470" y="272" text-anchor="middle" font-size="10" fill="#4DD0C8">stage → digest → approve → apply</text>
    <text class="m" x="280" y="263" text-anchor="end" font-size="10.5" fill="#4DD0C8">mecmcp</text>
    <text class="m" x="660" y="257" font-size="10.5" fill="#9AA2AD">mecmcp-changeset · -policy</text>
    <text class="m" x="660" y="271" font-size="10.5" fill="#9AA2AD">mecmcp-inventory · -device</text>
    <line x1="470" y1="282" x2="470" y2="302" stroke="#9AA2AD" stroke-width="1.2" marker-end="url(#a1)"/>

    <rect x="300" y="308" width="340" height="46" rx="5" fill="#2A1B4D" stroke="#7C3AED"/>
    <text class="m" x="470" y="329" text-anchor="middle" font-size="12.5" fill="#C4B5FD">vendor device client</text>
    <text class="m" x="470" y="344" text-anchor="middle" font-size="10" fill="#C4B5FD">DeviceTransaction impl</text>
    <text class="m" x="280" y="335" text-anchor="end" font-size="10.5" fill="#C4B5FD">vendor</text>
    <text class="m" x="660" y="329" font-size="10.5" fill="#9AA2AD">rustnetconf · quick-xml</text>
    <text class="m" x="660" y="343" font-size="10.5" fill="#9AA2AD">or mecmcp-http · -scp</text>
    <line x1="470" y1="354" x2="470" y2="374" stroke="#9AA2AD" stroke-width="1.2" marker-end="url(#a1)"/>

    <rect x="300" y="380" width="340" height="46" rx="5" fill="#171A22" stroke="#262B38"/>
    <text class="m" x="470" y="401" text-anchor="middle" font-size="12.5" fill="#F8F9FA">device or management plane</text>
    <text class="m" x="470" y="416" text-anchor="middle" font-size="10" fill="#9AA2AD">SRX · PAN-OS · Mist · SDC · Proxmox · UniFi</text>
    <text class="m" x="280" y="407" text-anchor="end" font-size="10.5" fill="#9AA2AD">target</text>

    <line x1="288" y1="92" x2="288" y2="138" stroke="#0D9488" stroke-width="2.5"/>
    <line x1="288" y1="236" x2="288" y2="282" stroke="#0D9488" stroke-width="2.5"/>
    <line x1="288" y1="164" x2="288" y2="210" stroke="#7C3AED" stroke-width="2.5"/>
    <line x1="288" y1="308" x2="288" y2="354" stroke="#7C3AED" stroke-width="2.5"/>
  </g>
</svg>
