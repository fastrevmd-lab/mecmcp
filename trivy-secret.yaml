# Allowlist for Trivy's secret scanner (security.yml's trivy-fs job).
# Same purpose as .gitleaksignore, but Trivy has its own allow-rule format
# and does not read gitleaks' ignore file.
allow-rules:
  # crates/mecmcp-redact/src/text.rs: pem_block_body_is_removed_but_headers_survive
  # asserts the redactor preserves PEM headers while stripping the body. The
  # body is fabricated ("FAKE") and already allowlisted for gitleaks; this is
  # the equivalent allowlist entry for Trivy's private-key detector.
  - id: mecmcp-redact-fake-pem-fixture
    description: synthetic PEM fixture in mecmcp-redact tests, not a real key
    path: 'crates/mecmcp-redact/src/text\.rs'
    regex: 'MIIFAKEBASE64=='
