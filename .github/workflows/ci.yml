name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  build-test:
    name: Build, lint, and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        # `test-util` on both crates, or the tests behind it are silently not
        # run. They are gated because they reach doors the public API does not
        # offer -- seeding a change set in a state only the lifecycle can
        # produce, and installing a tracing subscriber per thread -- and a gate
        # that CI does not open is a test that does not exist.
        run: cargo test --workspace --features mecmcp-audit/test-util,mecmcp-changeset/test-util

      - name: Build documentation
        run: cargo doc --workspace --no-deps

  msrv:
    # mecmcp-auth is a library consumed by two binaries, so an accidental MSRV
    # bump breaks them rather than this repo. That makes it exactly the wrong
    # thing to discover downstream.
    name: Minimum supported Rust 1.88
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the working toolchain; the MSRV floor declared
      # in Cargo.toml is deliberately lower. Remove the pin so the 1.88
      # toolchain below is what actually runs.
      - name: Drop the toolchain pin
        run: rm -f rust-toolchain.toml

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets
