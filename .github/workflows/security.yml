name: security

# Secret scan + Rust supply-chain checks. Actions pinned to commit SHAs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_LINUX_X64_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_LINUX_X64_SHA256" "$archive" |
            sha256sum --check --strict
          tar --extract --gzip --file="$archive" --directory="$RUNNER_TEMP" gitleaks
      - name: gitleaks (secrets)
        # Same scope as gitleaks-action, which needs a paid licence on organization repos:
        # the new commits of a PR or push; full history on schedule/manual runs.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          range=""
          case "$EVENT" in
            pull_request|pull_request_target) range="$PR_BASE..$PR_HEAD" ;;
            push) case "$PUSH_BEFORE" in ""|0000000000000000000000000000000000000000) ;; *) range="$PUSH_BEFORE..$PUSH_AFTER" ;; esac ;;
          esac
          if [ -n "$range" ]; then
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 --log-opts="$range" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
          fi

  cargo:
    name: cargo-audit + cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cargo-audit (RUSTSEC advisories)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Installed directly rather than via cargo-deny-action, which builds its
      # own image and so depends on Docker Hub at run time. That dependency
      # failed this job once already — three retries of
      # "dial tcp ...:443: i/o timeout" on the base image, with nothing wrong in
      # the repo. A supply-chain gate that goes red on an unrelated registry
      # outage is a gate people learn to ignore. Slower, but it only depends on
      # crates.io, which the job already needs. Matches rustpanosmcp.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny (advisories + licenses + bans + sources)
        run: cargo deny check advisories licenses bans sources
