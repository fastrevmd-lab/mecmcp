name: security

# Secret scan + Rust supply-chain checks. Actions pinned to commit SHAs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  cargo:
    name: cargo-audit + cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cargo.lock is gitignored here — this is a library, and the consuming
      # binaries pin transitively through their own lockfiles. Generate one so
      # the audit has something to scan.
      - name: Ensure Cargo.lock exists
        run: test -f Cargo.lock || cargo generate-lockfile
      - name: cargo-audit (RUSTSEC advisories)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # Installed directly rather than via cargo-deny-action, which builds its
      # own image and so depends on Docker Hub at run time. That dependency
      # failed this job once already — three retries of
      # "dial tcp ...:443: i/o timeout" on the base image, with nothing wrong in
      # the repo. A supply-chain gate that goes red on an unrelated registry
      # outage is a gate people learn to ignore. Slower, but it only depends on
      # crates.io, which the job already needs. Matches rustpanosmcp.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny (licenses + bans + sources)
        run: cargo deny check licenses bans sources
