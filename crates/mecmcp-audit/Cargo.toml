[package]
name        = "mecmcp-audit"
description = "Vendor-neutral audit events, attribution, and redaction for mechub MCP servers."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true

[lints]
workspace = true

[dependencies]
mecmcp-auth = { version = "0.3.0", path = "../mecmcp-auth" }
hmac        = { workspace = true }
metrics     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
sha2        = { workspace = true }
tempfile    = { workspace = true }
tracing     = { workspace = true }
tracing-journald = { workspace = true }
tracing-subscriber = { workspace = true }
uuid        = { workspace = true }

[dev-dependencies]
# Test-only: the exporter is used solely to render metrics in unit tests.
# It must NOT be a normal dependency — its default features pull an HTTP
# listener and hyper-rustls, which enables rustls's aws-lc-rs backend and
# conflicts with a consumer that pins `ring`. That broke TLS in a downstream
# server. Keep it here, and keep default-features off.
metrics-exporter-prometheus = { workspace = true }

[features]
test-util = []
