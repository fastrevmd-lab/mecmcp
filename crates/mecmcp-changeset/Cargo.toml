[package]
name         = "mecmcp-changeset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
mecmcp-audit = { version = "0.21.0", path = "../mecmcp-audit" }
async-trait  = { workspace = true }
hex          = "0.4"
serde        = { workspace = true }
serde_json   = { workspace = true, features = ["preserve_order"] }
sha2         = { workspace = true }
getrandom    = { workspace = true }
tokio        = { version = "1", features = ["sync", "macros", "rt", "time"] }
tokio-util   = { version = "0.7" }
tempfile     = { workspace = true }
mecmcp-secret = { version = "0.21.0", path = "../mecmcp-secret" }
rustix       = { workspace = true }
# Reporting only: the one place an evidence write can fail after the device has
# already acted, where refusing is impossible and silence is unacceptable.
tracing      = { workspace = true }
url          = "2"

[dev-dependencies]
hex = "0.4"
# `rt-multi-thread` for tests only. The atomic-claim test has to be able to
# fail: on a current-thread runtime the claimants never interleave, so a
# non-atomic claim would pass it.
tokio = { version = "1", features = ["sync", "macros", "rt", "rt-multi-thread", "time"] }
thiserror = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
